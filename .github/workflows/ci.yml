name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    env:
      TELCOAI_RETRIEVAL_STRATEGY: keyword
      TELCOAI_STORAGE_BACKEND: memory
      TELCOAI_GENERATION_BACKEND: extractive
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Validate lockfile
        run: uv lock --check
      - name: Lint and formatting
        run: |
          uv run --frozen --no-sync ruff check .
          uv run --frozen --no-sync ruff format --check .
      - name: Offline tests
        run: uv run --frozen --no-sync pytest -m "not integration" --cov=app --cov-report=term-missing
      - name: Retrieval benchmark (no model downloads)
        run: uv run --frozen --no-sync python scripts/evaluate_retrieval.py --output artifacts/retrieval-evaluation.json
      - name: Guarded workflow benchmark (no model downloads)
        run: uv run --frozen --no-sync python scripts/evaluate_workflow.py --output artifacts/workflow-evaluation.json
      - name: Ragas input export (no judge calls)
        run: uv run --frozen --no-sync python scripts/evaluate_ragas.py --output artifacts/ragas-inputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-python-${{ matrix.python }}
          path: artifacts/*.json

  qdrant-integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      TELCOAI_RETRIEVAL_STRATEGY: keyword
      TELCOAI_RUN_QDRANT_INTEGRATION: "1"
      TELCOAI_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Wait for the real Qdrant service
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import time
          import httpx
          for attempt in range(30):
              try:
                  httpx.get("http://127.0.0.1:6333/healthz", timeout=2).raise_for_status()
                  break
              except httpx.HTTPError:
                  time.sleep(1)
          else:
              raise SystemExit("Qdrant service did not become healthy")
          PY
      - name: Verify server payload indexes and filtered hybrid queries
        run: uv run --frozen --no-sync pytest tests/test_qdrant_retriever.py -k real_server_indexes_and_filtered_hybrid_search -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose definitions
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.enterprise.yaml --profile enterprise --profile grpc config --quiet
      - name: Build demo image
        run: docker build -t telcoai:ci .
      - name: Verify non-root runtime and HTTP readiness
        run: |
          docker run --rm --entrypoint python telcoai:ci -c 'import os; assert os.getuid() != 0'
          docker run -d --name telcoai-ci -p 127.0.0.1:8000:8000 telcoai:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 2
          done
          docker logs telcoai-ci
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs telcoai-ci || true
      - name: Clean up
        if: always()
        run: docker rm -f telcoai-ci || true
