[project]
name = "telcoai-enterprise-agent"
version = "1.0.0"
description = "Privacy-aware Turkish telecom support workflow with hybrid retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1",
  "numpy>=1.26,<3", "langgraph>=1,<2", "loguru>=0.7,<1",
  "presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3",
  "redis>=5,<7", "qdrant-client>=1.12,<2",
  "grpcio>=1.81.1,<2", "protobuf>=6.33.5,<7",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<7", "fastembed>=0.6,<1"]
observability = ["langfuse>=3,<5"]
guardrails = ["guardrails-ai>=0.6,<1"]
eval = ["mlflow>=3,<4", "ragas>=0.4,<0.5", "openai>=1.109,<3"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "grpcio-tools>=1.68,<2", "fakeredis>=2.26,<3"]

[tool.uv]
package = false

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"app/grpc/generated/*" = ["ALL"]

[tool.ruff.format]
exclude = ["app/grpc/generated/*"]
